<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Finanzen</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --card: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --accent: #2a78d6; --accent-ink: #fff; --good: #006300; --bad: #c62f2f; --warnbg: #fff4d6;
  --prev: #a3a29b; --neg: #e34948;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d0d0d; --card: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --accent: #3987e5; --good: #0ca30c; --bad: #e66767; --warnbg: #3a2f12;
    --prev: #6e6d67; --neg: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h2 { font-size: 20px; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* Kopf und Tabs */
header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: calc(var(--safe-t) + 10px) 16px 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
header.top h1 { font-size: 22px; flex: 1; }
.iconbtn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--ink2); }
.iconbtn:active { background: var(--border); }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(84px + var(--safe-b)); }
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--card); border-top: 1px solid var(--border); padding-bottom: var(--safe-b); }
nav.tabbar button { flex: 1; border: 0; background: none; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
nav.tabbar button[aria-current="page"] { color: var(--accent); }
nav.tabbar svg { width: 24px; height: 24px; }

/* Karten */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.chead { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.chead .sub { color: var(--ink2); font-size: 13px; margin-top: 2px; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; font-size: 13px; color: var(--ink2); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 5px 13px; font-size: 14px; cursor: pointer; }
.chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.yearbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.yearbar span { font-size: 13px; color: var(--ink2); flex: none; }

/* Kennzahlen */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--ink2); }
.kpi .v { font-size: 22px; font-weight: 650; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .d { font-size: 12px; color: var(--ink2); }
.up { color: var(--good); }
.down { color: var(--bad); }

/* Diagramme */
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 4px; }
.legend button { border: 0; background: none; padding: 3px 0; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); cursor: pointer; }
.legend button.off { opacity: .4; text-decoration: line-through; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.sw.ln { height: 0; width: 16px; border-radius: 0; border-top: 2.5px solid var(--c); background: none; }
.sw.ln.dash { border-top-style: dashed; }
.plot { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.plot svg { display: block; overflow: visible; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.16); padding: 8px 10px; font-size: 12.5px; min-width: 130px; max-width: 230px; }
.tip b { display: block; margin-bottom: 4px; font-size: 13px; }
.tip .r { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tip .r .n { flex: 1; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
.tip .r .x { font-variant-numeric: tabular-nums; font-weight: 600; }
.nodata { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
.note { color: var(--ink2); font-size: 13px; margin-top: 8px; }
details.tbl { margin-top: 6px; }
details.tbl summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 4px 0; }
.tscroll { overflow-x: auto; max-height: 340px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 6px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink2); font-weight: 600; position: sticky; top: 0; background: var(--card); }
tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
tr.click { cursor: pointer; }

/* Formulare */
.field { display: grid; grid-template-columns: 1fr 150px; align-items: center; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.field:last-of-type { border-bottom: 0; }
.field label { font-size: 15px; }
.field .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.inwrap { position: relative; }
.inwrap .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
input.inp, select.inp, textarea.inp { width: 100%; font: 16px var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; }
.inwrap input.inp { text-align: right; padding-right: 28px; font-variant-numeric: tabular-nums; }
input.inp:focus, select.inp:focus, textarea.inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.inp.bad { outline: 2px solid var(--bad); }
textarea.inp { min-height: 150px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
.stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.stepper .lbl { flex: 1; text-align: center; font-size: 18px; font-weight: 650; }
.stepper input[type=month] { flex: 1; text-align: center; font-weight: 600; }
.calc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); padding: 8px 0 2px; }
.calc b { color: var(--ink); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 10px; padding: 11px 16px; cursor: pointer; font-size: 15px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.ghost.danger { background: transparent; color: var(--bad); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; }
.btn:active { filter: brightness(.92); }
.banner { background: var(--warnbg); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.banner p { flex: 1; }
.banner .btn { padding: 8px 12px; font-size: 14px; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack > * + * { margin-top: 10px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
ul.plain { margin: 6px 0 0; padding-left: 18px; color: var(--ink2); font-size: 13px; }

/* Start, Sperre, Abdeckung */
.screen { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px); }
.screen .box { width: 100%; max-width: 380px; }
.screen .logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 14px; }
.screen h2 { text-align: center; margin-bottom: 8px; }
.screen p.lead { text-align: center; color: var(--ink2); margin-bottom: 18px; font-size: 14px; }
.screen form > * + * { margin-top: 10px; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 8px; font-size: 14px; display: block; margin: 6px auto 0; }
#cover { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none; align-items: center; justify-content: center; }
body.covered #cover { display: flex; }
dialog { border: 1px solid var(--border); border-radius: 16px; background: var(--card); color: var(--ink); padding: 18px; width: min(92vw, 380px); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h3 { margin-bottom: 8px; }
dialog p { color: var(--ink2); font-size: 14px; margin-bottom: 10px; white-space: pre-line; }
dialog input { margin-bottom: 8px; }
dialog .btnrow { justify-content: flex-end; }
#toast { position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 300; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 360px) { .field { grid-template-columns: 1fr 120px; } }
</style>
</head>
<body>

<!-- Nur für Daten aus Version 1.0, die noch mit Passwort gespeichert wurden: einmal öffnen, danach ohne Passwort -->
<div id="lock" class="screen" hidden>
  <div class="box">
    <img class="logo" src="icon.png" alt="">
    <h2>Einmal entsperren</h2>
    <p class="lead">Die Passwort-Funktion wurde entfernt. Gib dein bisheriges Passwort ein letztes Mal ein – danach öffnet sich die App ohne Passwort.</p>
    <form id="lockForm" autocomplete="on">
      <input type="text" name="username" value="Finanzen" autocomplete="username" hidden>
      <input class="inp" id="lockPw" type="password" placeholder="Bisheriges Passwort" autocomplete="current-password">
      <p class="err" id="lockErr"></p>
      <button class="btn wide" type="submit" id="lockBtn">Entsperren</button>
    </form>
    <button class="linkbtn" id="lockForgot" type="button">Passwort vergessen?</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <h1 id="title">Übersicht</h1>
  </header>
  <main>
    <section id="tab-dash"></section>
    <section id="tab-entry" hidden></section>
    <section id="tab-set" hidden></section>
  </main>
  <nav class="tabbar">
    <button type="button" data-tab="dash" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Übersicht</button>
    <button type="button" data-tab="entry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Erfassen</button>
    <button type="button" data-tab="set">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Einstellungen</button>
  </nav>
</div>

<div id="cover"><img class="logo" src="icon.png" alt="" style="width:72px;height:72px;border-radius:18px"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============================================================
   Grundlagen
   ============================================================ */
const APP_VERSION = '1.2';
const KEY = 'finanzen.v1', UIKEY = 'finanzen.ui', ITER = 310000;
const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const MON_LONG = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const SVGNS = 'http://www.w3.org/2000/svg';

let S = null;            // aktuelle Daten
const UI_DEFAULT = { tab: 'dash', entry: 'monat', year: null, month: null, eyear: null, divMode: 'vergleich', cumDiv: 'gesamt', cumPas: 'gesamt', smooth: 'roh', trend: 'lin', imp: 'monate' };
let ui = loadUi();

const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
function sv(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  return e;
}
function loadUi() {
  try { return Object.assign({}, UI_DEFAULT, JSON.parse(localStorage.getItem(UIKEY) || '{}')); }
  catch (e) { return Object.assign({}, UI_DEFAULT); }
}
function saveUi() { try { localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch (e) {} }

/* Zahlen */
const NF0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const NF2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const eur = v => v == null || !isFinite(v) ? '–' : NF0.format(Math.round(v)) + ' €';
const eur2 = v => v == null || !isFinite(v) ? '–' : NF2.format(v) + ' €';
const pct = (v, d = 1) => v == null || !isFinite(v) ? '–' : (d ? NF1 : NF0).format(v) + ' %';
const sign = v => v > 0 ? '+' : '';
const sEur = v => v == null ? '–' : sign(v) + eur(v);
const sPct = v => v == null || !isFinite(v) ? '–' : sign(v) + pct(v);
function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return NF1.format(v / 1e6).replace(/,0$/, '') + ' Mio';
  if (a >= 1e4) return NF0.format(v / 1e3) + ' T';
  if (a >= 1e3) return NF1.format(v / 1e3).replace(/,0$/, '') + ' T';
  return NF0.format(v);
}
const pctAxis = v => NF0.format(v) + ' %';
function parseNum(str) {
  if (str == null) return null;
  let t = String(str).trim().replace(/[€%\s ]/g, '').replace(/−/g, '-');
  if (t === '' || t === '-' || t === '–') return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const v = Number(t);
  return isFinite(v) ? v : NaN;
}
function inVal(v) {
  if (v == null) return '';
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ',');
}
const round2 = v => Math.round(v * 100) / 100;
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sum = a => a.reduce((x, y) => x + (y || 0), 0);

/* Monate */
const mk = (y, m) => y + '-' + String(m).padStart(2, '0');
const kIdx = k => { const [y, m] = k.split('-').map(Number); return y * 12 + m - 1; };
const iKey = t => mk(Math.floor(t / 12), t % 12 + 1);
const kAdd = (k, n) => iKey(kIdx(k) + n);
const kYear = k => +k.slice(0, 4);
const kMon = k => +k.slice(5, 7);
const kLabel = k => MON[kMon(k) - 1] + ' ' + kYear(k);
function nowKey() { const d = new Date(); return mk(d.getFullYear(), d.getMonth() + 1); }

/* ============================================================
   Nur noch Lesen alter verschlüsselter Daten aus Version 1.0
   (AES-GCM 256, Schlüssel per PBKDF2-SHA256)
   ============================================================ */
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function unseal(env, key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ============================================================
   Datenhaltung
   ============================================================ */
// Vermögen wird für 3 Personen geführt: Ehepaar zusammen, Kind 1, Kind 2.
// Datenstand v1 hatte 4 Personen (Ich, Frau getrennt) – migrate() fasst die ersten beiden zusammen.
const NP = 3, PIDX = [0, 1, 2];
function emptyState() {
  return { v: 2, settings: { names: ['Wir', 'Kind 1', 'Kind 2'], ziel: 30, lastBackup: null, lastChange: null }, months: {}, years: {} };
}
function migrate(d) {
  const e = emptyState();
  if (!d || typeof d !== 'object') return e;
  const old = !(d.v >= 2);
  const numOrNull = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  const st = Object.assign({}, e.settings, d.settings || {});
  delete st.lockMin;
  if (old && Array.isArray(st.names) && st.names.length === 4) {
    const [a, b] = st.names;
    const pair = a === 'Ich' && b === 'Frau' ? 'Wir' : [a, b].filter(Boolean).join(' & ');
    st.names = [pair, st.names[2], st.names[3]];
  }
  if (!Array.isArray(st.names) || st.names.length !== NP) st.names = e.settings.names;
  st.names = st.names.map((n, i) => String(n || e.settings.names[i]).slice(0, 30));
  const pairSum = (x, y) => x == null && y == null ? null : (x || 0) + (y || 0);
  const wOf = r => {
    if (!Array.isArray(r.w)) return PIDX.map(() => null);
    const w = r.w.map(numOrNull);
    return old ? [pairSum(w[0], w[1]), w[2] ?? null, w[3] ?? null] : PIDX.map(i => w[i] ?? null);
  };
  const months = {}, years = {};
  for (const [k, m] of Object.entries(d.months || {})) {
    if (!/^\d{4}-\d{2}$/.test(k) || !m) continue;
    const o = {};
    for (const f of ['ein', 'aus', 'div', 'pas', 'sq']) { const v = numOrNull(m[f]); if (v != null) o[f] = v; }
    if (Object.keys(o).length) months[k] = o;
  }

}

}

function parseMonth(s) {
  s = String(s).trim().toLowerCase().replace(/\.$/, '');
  const yr = t => t.length === 2 ? 2000 + +t : +t;
  const ok = (y, m) => y >= 1990 && y <= 2100 && m >= 1 && m <= 12 ? mk(y, m) : null;
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return ok(+m[1], +m[2]);
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})$/))) return ok(+m[1], +m[2]);
  if ((m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4}|\d{2})$/))) return ok(yr(m[3]), +m[2]);
  if ((m = s.match(/^(\d{1,2})[.\/-](\d{4}|\d{2})$/))) return ok(yr(m[2]), +m[1]);
  if ((m = s.match(/^([a-zäöü]+)\.?[\s\-'’]*(\d{4}|\d{2})$/))) { const mo = MNAMES[m[1]]; if (mo) return ok(yr(m[2]), mo); }

}

/* Sicherung */
async function shareFile(name, content, type) {
  const file = new File([content], name, { type });
  const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(file);
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  return true;
}
async function exportBackup() {
  const prev = S.settings.lastBackup;
  S.settings.lastBackup = Date.now();
  const env = Object.assign(envelope(), { exported: new Date().toISOString() });
  const d = new Date(), name = 'finanzen-sicherung-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.json';
  const ok = await shareFile(name, JSON.stringify(env), 'application/json');
  if (ok) { persist(false); toast('Sicherung erstellt'); }
  else S.settings.lastBackup = prev;
  if (ui.tab === 'dash') renderDash(); else if (ui.tab === 'set') renderSettings();
}

async function readBackupFile(file) {

  if (!env || env.fmt !== 'finanzen') { await ask({ title: 'Falsche Datei', text: 'Diese Datei stammt nicht aus der Finanzübersicht.', cancel: null }); return null; }

      catch (e) { return 'Passwort falsch.'; }

  showApp();
}

/* Daten */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function demoData() {
  const r = mulberry32(42), months = {}, years = {};
  const base = [70000, 3000, 2000], g = [0.13, 0.22, 0.25];
  const rets = { 2022: -13.2, 2023: 17.1, 2024: 19.4, 2025: 8.3, 2026: 10.6 };
  let depot = 30000;
  const thisY = new Date().getFullYear();
  for (let y = 2021; y <= Math.min(2026, thisY); y++) {
    const o = { w: base.map((b, j) => Math.round(b * Math.pow(1 + g[j], y - 2021) * (0.96 + r() * 0.08) / 100) * 100) };
    if (y > 2021) { const e = Math.round(8000 + r() * 3000); const ret = rets[y] / 100; depot = depot * (1 + ret) + e * (1 + ret / 2); o.einz = e; }
    o.depot = Math.round(depot);
    years[y] = o;
  }
  const season = [0.55, 0.75, 1.45, 1.7, 1.85, 1.05, 0.7, 0.75, 1.2, 0.65, 0.75, 1.3];
  const end = kAdd(nowKey(), -1);
  for (const k of keyRange('2022-01', end)) {
    const y = kYear(k), m = kMon(k), yrs = (kIdx(k) - kIdx('2022-01')) / 12;
    const o = { div: round2(70 * Math.pow(1.28, yrs) * season[m - 1] * (0.85 + r() * 0.3)) };
    if (y >= 2023) o.pas = Math.round(10 + (kIdx(k) - kIdx('2023-01')) * 1.6 + r() * 8);
    if (y >= 2024) {
      o.ein = Math.round(5300 * Math.pow(1.03, y - 2024) + (m === 11 ? 3200 : 0) + (m === 6 ? 1500 : 0) + (r() - 0.5) * 200);
      o.aus = Math.round(3350 * Math.pow(1.025, y - 2024) * (m === 12 ? 1.35 : m === 8 ? 1.3 : 1) * (0.88 + r() * 0.24));
    }
    months[k] = o;
  }
  return { months, years };
}

function ask({ title, text, fields = [], ok = 'OK', cancel = 'Abbrechen', danger = false, validate = null }) {
  return new Promise(res => {
    const d = $('#dlg'); d.textContent = '';
    const inputs = fields.map(f => h('input', { class: 'inp', type: f.type || 'text', placeholder: f.label, 'aria-label': f.label, autocomplete: f.ac || 'off' }));
    const err = h('p', { class: 'err' });
    let busy = false;
    const done = v => { d.close(); res(v); };
    const okB = h('button', { class: 'btn' + (danger ? ' danger' : ''), type: 'button', text: ok });
    okB.addEventListener('click', async () => {
      if (busy) return;
      const vals = inputs.map(i => i.value);
      if (validate) {
        busy = true; okB.disabled = true; err.textContent = '';
        const m = await validate(vals);
        busy = false; okB.disabled = false;
        if (m) { err.textContent = m; return; }
      }
      done(fields.length ? vals : true);
    });
    d.append(h('h3', { text: title }), text ? h('p', { text }) : null, inputs, fields.length ? err : null,
      h('div', { class: 'btnrow' }, cancel ? h('button', { class: 'btn ghost', type: 'button', text: cancel, onclick: () => done(null) }) : null, okB));
    d.oncancel = e => { e.preventDefault(); if (cancel) done(null); };
    inputs.forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); okB.click(); } }));
    d.showModal();
    if (inputs[0]) inputs[0].focus();
  });
}

    persist(false);
    showApp();
    toast('Passwort entfernt – ab jetzt ohne Passwort');
  } catch (err) { $('#lockErr').textContent = 'Passwort falsch.'; }
  btn.disabled = false;
});
$('#lockForgot').addEventListener('click', async () => {
  if (!await ask({ title: 'Passwort vergessen', text: 'Ohne das bisherige Passwort lassen sich diese Daten nicht mehr öffnen.\n\nDu kannst alles auf diesem Gerät löschen und neu beginnen – danach z. B. eine Sicherung laden.', ok: 'Alles löschen…', danger: true })) return;
  if (!await ask({ title: 'Wirklich alles löschen?', text: 'Alle Finanzdaten auf diesem Gerät werden unwiderruflich gelöscht.', ok: 'Endgültig löschen', danger: true })) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  boot();
});

/* Sichtschutz im App-Umschalter */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S) document.body.classList.add('covered'); }
  else document.body.classList.remove('covered');
});

function boot() {
  S = null;
  const env = readEnvelope();
  if (env && env.enc) {
    if (window.crypto && crypto.subtle) { showScreen('lock'); return; }
    document.body.textContent = 'Die alten Daten lassen sich nur über https öffnen.'; return;
  }
  S = env ? migrate(env.data) : emptyState();
  if (env && !(env.data && env.data.v >= 2)) persist(false);   // umgestellten Datenstand gleich speichern
  showApp();
}
{
  boot();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
